[package]
name = "icopia"
version = "0.1.0"
edition = "2021"

[lib]
name = "icopia"
path = "src/lib.rs"

[[bin]]
name = "icopia"
path = "src/main.rs"

[[bin]]
name = "icopia-bandeja"
path = "src/bin/icopia-bandeja.rs"

[[bin]]
name = "icopia-login"
path = "src/bin/icopia-login.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
hex = "0.4"
native-windows-gui = { version = "1.0.13", default-features = false, features = ["notice"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rfd = "0.15"
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tao = "0.30"
tauri-winrt-notification = "0.7"
tray-icon = "0.19"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Power", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.52"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
png = "0.17"
tempfile = "3"
